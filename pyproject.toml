[project]
name = "gerrit-openapi-mcp"
version = "0.1.0"
description = "Direct Gerrit OpenAPI to MCP bridge, with explicit profiles"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=4.2,<5",
  "httpx2>=2.16,<3",
  "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9"]

[project.scripts]
gerrit-openapi-mcp = "gerrit_openapi_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gerrit_openapi_mcp"]

# Ship the generated specs and skills inside the wheel so a `uvx --from git+...`
# install serves without the sibling gerrit-openapi checkout or ~/.claude/skills.
[tool.hatch.build.targets.wheel.force-include]
"generated" = "gerrit_openapi_mcp/generated"
".claude/skills" = "gerrit_openapi_mcp/skills_data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
